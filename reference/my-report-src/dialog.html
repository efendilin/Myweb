<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>My EReport — Dialog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Roboto, Arial, sans-serif; font-size: 13px; overflow: hidden; height: 100vh; }

  .layout { display: flex; flex-direction: row; height: 100vh; padding-top: 48px; }

  /* AppBar */
  .app-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px;
    background: #282c34; color: #fff;
    display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 200;
  }
  .app-bar span { font-size: 15px; font-weight: bold; }
  #profile-select {
    background: #3a3f4b; color: #fff;
    border: 1px solid #555; border-radius: 4px;
    padding: 3px 6px; font-size: 13px; cursor: pointer;
  }
  #profile-select:focus { outline: 1px solid #90caf9; }

  /* Tree panel */
  .tree-panel {
    width: 220px; min-width: 180px; border-right: 1px solid #ccc;
    overflow-y: auto; padding: 6px; background: #fafafa; flex-shrink: 0;
  }
  .tree-root { list-style: none; padding: 0; margin: 0; }
  .tree-category { margin: 2px 0; }
  .tree-category-label {
    cursor: pointer; font-weight: bold; padding: 3px 6px; display: block;
    background: #e0e0e0; border-radius: 3px; user-select: none; font-size: 12px;
  }
  .tree-category-label:hover { background: #bdbdbd; }
  .tree-items { list-style: none; padding-left: 12px; margin: 0; }
  .tree-item {
    cursor: pointer; padding: 2px 6px; border-radius: 2px; font-size: 12px;
  }
  .tree-item:hover { background: #1976d2; color: #fff; }

  /* Content panel */
  .content-panel { flex: 1; overflow-y: auto; padding: 8px; }

  /* Dialogs */
  dialog {
    border: none; padding: 0; border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    max-width: 100vw; max-height: 100vh;
    width: 100vw; height: 100vh;
  }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  .dialog-layout { display: flex; flex-direction: column; height: 100%; }
  .dialog-title {
    background: #282c34; color: #fff; padding: 12px 16px;
    font-size: 15px; font-weight: bold; flex-shrink: 0;
  }
  .dialog-content {
    flex: 1; overflow-y: auto; padding: 12px;
  }
  .dialog-actions {
    border-top: 1px solid #ccc; padding: 8px 12px;
    display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    background: #fafafa;
  }
  button {
    padding: 6px 18px; border: none; border-radius: 4px; cursor: pointer;
    background: #1976d2; color: #fff; font-size: 13px;
  }
  button:hover { background: #115293; }
  button.secondary { background: #757575; }
  button.secondary:hover { background: #424242; }

  /* Form elements */
  form { padding: 4px 0; }
  input[type=radio], input[type=checkbox] { margin-right: 3px; }
  select { font-size: 13px; padding: 2px 4px; }
  textarea { font-size: 13px; font-family: inherit; }
</style>
</head>
<body>
<div class="app-bar">
  <span>&#128196; My EReport</span>
  <select id="profile-select" title="切換 Template"></select>
</div>
<div class="layout">
  <div class="tree-panel" id="tree-container"></div>
  <div class="content-panel" id="content-panel">
    <p style="color:#aaa; font-size:12px;">← 從左側選取樣板</p>
  </div>
</div>

<!-- Selector dialog (shows form) -->
<dialog id="selector-dialog">
  <div class="dialog-layout">
    <div class="dialog-title">Selector</div>
    <div class="dialog-content" id="form-container"></div>
    <div class="dialog-actions">
      <button class="secondary" id="btn-edit">Edit</button>
      <button class="secondary" id="btn-cancel">Cancel</button>
      <button id="btn-ok">OK</button>
    </div>
  </div>
</dialog>

<!-- Edit dialog (shows raw template textarea) -->
<dialog id="edit-dialog">
  <div class="dialog-layout">
    <div class="dialog-title">Editor</div>
    <div class="dialog-content">
      <textarea id="editext" style="width:100%;height:calc(100vh - 160px);border:3px solid #ccc;padding:5px;overflow:auto;resize:none;"></textarea>
    </div>
    <div class="dialog-actions">
      <button class="secondary" id="btn-edit-cancel">Cancel</button>
      <button id="btn-edit-save">SAVE</button>
    </div>
  </div>
</dialog>

<script src="utils.js"></script>
<script src="makeOption.js"></script>
<script src="dialog.js"></script>
</body>
</html>
